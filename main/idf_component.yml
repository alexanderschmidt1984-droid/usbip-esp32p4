dependencies:
  espressif/mdns:
    version: "*"
  # IDF 6.0 moved the USB host layer and the IP101 Ethernet PHY driver out of
  # core into the component registry (they were in-core through 5.x). Required
  # to build on ESP-IDF 6.0+. They still register as components "usb" / "ip101".
  espressif/usb: ">=1.6.0"  # 1.6.0 fixes hub/enum issues
  espressif/ip101:
    version: "^1.0.0"
  # WireGuard: esphome/wireguard 0.4.8 is vendored with security fixes in
  # components/wireguard (see PATCHED.md); it needs ESPHome's libsodium port.
  esphome/libsodium: "^1.10021.1"
